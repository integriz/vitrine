name: Atualizar produtos

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (o GitHub pode atrasar um pouco)
  workflow_dispatch:          # permite rodar na hora, pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: atualizar-produtos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar produtos.json a partir da planilha
        run: python3 atualizar.py

      - name: Salvar se mudou
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain produtos.json)" ]; then
            git config user.name "vitrine-bot"
            git config user.email "bot@users.noreply.github.com"
            git add produtos.json
            git commit -m "Atualiza produtos"
            git pull --rebase origin main
            git push
          else
            echo "Nada mudou."
          fi
