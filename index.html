
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vitrine de produtos</title>

<style>
:root {
  --card: #ffffff;
  --txt: #222;
  --sub: #555;
  --bd: #e5e5e5;
  --ac: #3f82e6;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;
}

html {
  overflow-x: hidden;
  scrollbar-width: none;
}

body {
  background: #fff;
  color: var(--txt);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
  padding: 12px 10px 40px;
}

.wrap {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.titulo-vitrine {
  text-align: center;
  color: #222;
  font-size: clamp(21px, 3vw, 28px);
  margin: 12px 0 22px;
  font-weight: bold;
}

/* GRID PRINCIPAL */
#grid {
  display: grid;
  width: 100%;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px;
  align-items: stretch;
}

/* CARDS */
.card {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 0;
  background: var(--card);
  border: 1px solid var(--bd);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

/* IMAGENS */
.img {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #fff;
  overflow: hidden;
  text-decoration: none;
}

.img img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.ph {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: #999;
}

/* CONTEÚDO */
.b {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 12px;
  padding: 13px;
}

h3 {
  margin: 0;
  color: var(--ac);
  font-size: 15px;
  line-height: 1.4;
  min-height: 42px;
  text-align: center;
  overflow-wrap: anywhere;

  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* BOTÃO */
.btn {
  display: block;
  width: 100%;
  margin-top: auto;
  text-align: center;
  text-decoration: none;
  background: var(--ac);
  color: #fff;
  font-weight: bold;
  font-size: 13px;
  padding: 12px 8px;
  border-radius: 9px;
  transition: background 0.2s;
}

.btn:hover {
  background: #2868c4;
}

.btn:focus-visible,
.img:focus-visible {
  outline: 3px solid var(--ac);
  outline-offset: 2px;
}

#msg {
  font-size: 14px;
  text-align: center;
  color: var(--sub);
  padding: 40px 10px;
}

#msg[hidden] {
  display: none;
}

/* TABLETS */
@media (min-width: 601px) and (max-width: 900px) {
  #grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
}

/* CELULARES */
@media (max-width: 600px) {
  body {
    padding: 8px 8px 30px;
  }

  .wrap {
    width: 100%;
  }

  .titulo-vitrine {
    font-size: 21px;
    margin: 12px 0 18px;
  }

  #grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 16px;
  }

  .card {
    width: 100%;
    border-radius: 12px;
  }

  .img {
    aspect-ratio: 1 / 1;
  }

  .b {
    padding: 14px;
    gap: 12px;
  }

  h3 {
    font-size: 16px;
    min-height: auto;
    line-height: 1.4;
  }

  .btn {
    font-size: 15px;
    padding: 14px 10px;
  }
}

/* CELULARES MUITO PEQUENOS */
@media (max-width: 340px) {
  body {
    padding-left: 5px;
    padding-right: 5px;
  }

  .titulo-vitrine {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <h1 class="titulo-vitrine">Minha Vitrine de Produtos</h1>

  <div id="grid"></div>

  <p id="msg">Carregando produtos…</p>

</div>

<script>

// ===== CONFIGURAÇÃO =====

const ARQUIVO_PRODUTOS = "produtos.json";

const INTERVALO_SEGUNDOS = 300;

const TEXTO_BOTAO = "Comprar no Mercado Livre";

// ========================

const grid = document.getElementById("grid");
const msg = document.getElementById("msg");

let assinaturaAtual = null;

function urlSegura(u) {
  return /^https?:\/\//i.test((u || "").trim())
    ? u.trim()
    : "";
}

function desenhar(produtos) {

  grid.textContent = "";

  for (const p of produtos) {

    const card = document.createElement("div");
    card.className = "card";

    const imgLink = document.createElement("a");

    imgLink.className = "img";
    imgLink.href = p.link;
    imgLink.target = "_blank";
    imgLink.rel = "noopener noreferrer";
    imgLink.setAttribute("aria-label", p.titulo);

    if (p.img) {

      const im = document.createElement("img");

      im.src = p.img;
      im.alt = p.titulo;
      im.loading = "lazy";

      im.onerror = () => {

        imgLink.textContent = "";

        const ph = document.createElement("span");

        ph.className = "ph";
        ph.textContent = "Sem imagem";

        imgLink.appendChild(ph);

      };

      imgLink.appendChild(im);

    } else {

      const ph = document.createElement("span");

      ph.className = "ph";
      ph.textContent = "Sem imagem";

      imgLink.appendChild(ph);

    }

    const b = document.createElement("div");
    b.className = "b";

    const h = document.createElement("h3");

    h.textContent = p.titulo;
    h.title = p.titulo;

    const btn = document.createElement("a");

    btn.className = "btn";
    btn.href = p.link;
    btn.target = "_blank";
    btn.rel = "noopener noreferrer";
    btn.textContent = TEXTO_BOTAO;

    b.append(h, btn);

    card.append(imgLink, b);

    grid.appendChild(card);

  }

}

async function carregar() {

  try {

    const r = await fetch(ARQUIVO_PRODUTOS, {
      cache: "no-cache"
    });

    if (!r.ok) {
      throw new Error("HTTP " + r.status);
    }

    const dados = await r.json();

    const produtos = (Array.isArray(dados) ? dados : [])
      .map(p => ({
        titulo: (p.titulo || "").trim(),
        link: urlSegura(p.link),
        img: urlSegura(p.img)
      }))
      .filter(p => p.titulo && p.link);

    const assinatura = JSON.stringify(produtos);

    if (assinatura === assinaturaAtual) {
      return;
    }

    assinaturaAtual = assinatura;

    if (!produtos.length) {

      grid.textContent = "";

      msg.textContent = "Nenhum produto cadastrado ainda.";

      msg.hidden = false;

      return;
    }

    desenhar(produtos);

    msg.hidden = true;

  } catch (e) {

    if (assinaturaAtual === null) {

      msg.textContent =
        "Não foi possível carregar os produtos agora. Tente novamente em instantes.";

      msg.hidden = false;

    }

  }

}

carregar();

setInterval(() => {

  if (!document.hidden) {
    carregar();
  }

}, INTERVALO_SEGUNDOS * 1000);

document.addEventListener("visibilitychange", () => {

  if (!document.hidden) {
    carregar();
  }

});

</script>

</body>
</html>
