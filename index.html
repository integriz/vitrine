<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine de produtos</title>
<style>
  :root { --card:#fafafa; --txt:#222; --sub:#555; --bd:#e3e3e3; --ac:#3f82e6; }
  * { box-sizing: border-box; }
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  body {
    margin: 0; background: #ffffff; color: var(--txt);
    font-family: Arial, sans-serif;
    padding: clamp(8px, 2vw, 20px);
    padding-bottom: clamp(120px, 22vh, 220px);
    overflow-x: hidden; overflow-y: auto;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  
  .titulo-vitrine {
    text-align: center;
    color: #222;
    font-size: clamp(20px, 3vw, 28px);
    margin: 10px 0 25px;
    font-weight: bold;
}
  #grid {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(8px, 1.8vw, 18px);
  }
  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--bd);
    border-radius: 12px; overflow: hidden; min-width: 0;
  }
  .img {
    position: relative; display: block; flex: none;
    width: 100%; aspect-ratio: 1 / 1; background: #fff;
    overflow: hidden; text-decoration: none;
  }
  .img img {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain; display: block;
  }
  .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; text-align: center; color: #999; padding: 8px;
  }
  .b {
    display: flex; flex-direction: column; flex: 1;
    gap: clamp(8px, 1.4vw, 12px);
    padding: clamp(8px, 1.6vw, 14px);
  }
  h3 {
    margin: 0; color: var(--ac);
    font-size: clamp(13px, 1.8vw, 16px); line-height: 1.25;
    min-height: 2.5em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow-wrap: anywhere;
    text-align: center;
  }
  .btn {
    display: block; margin-top: auto; text-align: center; text-decoration: none;
    background: var(--ac); color: #fff; font-weight: bold;
    font-size: clamp(11px, 1.5vw, 13px);
    padding: clamp(8px, 1.4vw, 10px) 6px;
    border-radius: 8px;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:focus-visible, .img:focus-visible { outline: 3px solid var(--ac); outline-offset: 2px; }
  #msg { font-size: 14px; text-align: center; color: var(--sub); padding: 40px 0; }
  #msg[hidden] { display: none; }
  @media (max-width: 600px) { #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 340px) { #grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="titulo-vitrine">Minha Vitrine de Produtos</h1>
  <div id="grid"></div>
  <p id="msg">Carregando produtos…</p>
</div>

<script>
// ===== CONFIGURAÇÃO =====
// Arquivo gerado automaticamente a partir da planilha (fica na mesma pasta desta página)
const ARQUIVO_PRODUTOS = "produtos.json";

// De quantos em quantos segundos a página confere se há produto novo (300 = 5 minutos)
const INTERVALO_SEGUNDOS = 60;

// Texto do botão
const TEXTO_BOTAO = "Comprar no Mercado Livre";
// ========================

const grid = document.getElementById("grid");
const msg = document.getElementById("msg");
let assinaturaAtual = null;

function urlSegura(u) { return /^https?:\/\//i.test((u || "").trim()) ? u.trim() : ""; }

function desenhar(produtos) {
  grid.textContent = "";
  for (const p of produtos) {
    const card = document.createElement("div"); card.className = "card";

    const imgLink = document.createElement("a");
    imgLink.className = "img"; imgLink.href = p.link; imgLink.target = "_blank"; imgLink.rel = "noopener noreferrer";
    imgLink.setAttribute("aria-label", p.titulo);
    if (p.img) {
      const im = document.createElement("img");
      im.src = p.img; im.alt = p.titulo; im.loading = "lazy";
      im.onerror = () => { imgLink.textContent = ""; const ph = document.createElement("span"); ph.className = "ph"; ph.textContent = "Sem imagem"; imgLink.appendChild(ph); };
      imgLink.appendChild(im);
    } else {
      const ph = document.createElement("span"); ph.className = "ph"; ph.textContent = "Sem imagem"; imgLink.appendChild(ph);
    }

    const b = document.createElement("div"); b.className = "b";
    const h = document.createElement("h3"); h.textContent = p.titulo; h.title = p.titulo;
    const btn = document.createElement("a");
    btn.className = "btn"; btn.href = p.link; btn.target = "_blank"; btn.rel = "noopener noreferrer";
    btn.textContent = TEXTO_BOTAO;
    b.append(h, btn);

    card.append(imgLink, b); grid.appendChild(card);
  }
}

async function carregar() {
  try {
    const r = await fetch(ARQUIVO_PRODUTOS, { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const dados = await r.json();
    const produtos = (Array.isArray(dados) ? dados : [])
      .map(p => ({ titulo: (p.titulo || "").trim(), link: urlSegura(p.link), img: urlSegura(p.img) }))
      .filter(p => p.titulo && p.link);
    const assinatura = JSON.stringify(produtos);
    if (assinatura === assinaturaAtual) return;
    assinaturaAtual = assinatura;
    if (!produtos.length) { grid.textContent = ""; msg.textContent = "Nenhum produto cadastrado ainda."; msg.hidden = false; return; }
    desenhar(produtos);
    msg.hidden = true;
  } catch (e) {
    if (assinaturaAtual === null) { msg.textContent = "Não foi possível carregar os produtos agora. Tente novamente em instantes."; msg.hidden = false; }
  }
}

carregar();
setInterval(() => { if (!document.hidden) carregar(); }, INTERVALO_SEGUNDOS * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); });
</script>
</body>
</html>
